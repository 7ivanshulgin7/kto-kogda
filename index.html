<style>
/* Тема: светлая по умолчанию, тёмная по системе или data-theme */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --card:#FFFFFF; --field:rgba(118,118,128,.12);
  --ink:#000000; --muted:#6C6C70; --dim:#8E8E93; --red:#FF3B30; --green:#34C759; --greenInk:#248A3D;
  --glass:rgba(250,250,252,.72); --glassBorder:rgba(0,0,0,.08); --sheet:rgba(250,250,252,.94);
  --sel:rgba(0,0,0,.07); --chipOff:#E5E5EA; --line:rgba(60,60,67,.14);
  --shadow:0 10px 30px rgba(0,0,0,.12); --gloss:rgba(255,255,255,.6); --itv:#FF2E93;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#151517; --card:#1C1C1E; --field:rgba(255,255,255,.08);
  --ink:#F5F5F7; --muted:#8E8E93; --dim:#636366; --red:#FF453A; --green:#30D158; --greenInk:#30D158;
  --glass:rgba(38,38,42,.58); --glassBorder:rgba(255,255,255,.13); --sheet:rgba(32,32,36,.88);
  --sel:rgba(255,255,255,.14); --chipOff:#0E0E10; --line:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.55); --gloss:rgba(255,255,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#151517; --card:#1C1C1E; --field:rgba(255,255,255,.08);
  --ink:#F5F5F7; --muted:#8E8E93; --dim:#636366; --red:#FF453A; --green:#30D158; --greenInk:#30D158;
  --glass:rgba(38,38,42,.58); --glassBorder:rgba(255,255,255,.13); --sheet:rgba(32,32,36,.88);
  --sel:rgba(255,255,255,.14); --chipOff:#0E0E10; --line:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.55); --gloss:rgba(255,255,255,.10); color-scheme:dark}

html{touch-action:manipulation;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;
  font-family:-apple-system,system-ui,"SF Pro Text","Google Sans","Roboto Flex",Roboto,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background-color .3s}
button,input{font:inherit;color:inherit}
input{font-size:16px;-webkit-user-select:text;user-select:text}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.num,.n,.md .num,.mmh small{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--gloss),var(--shadow)}
.press{transition:transform .16s cubic-bezier(.3,.7,.4,1)}
.press:active{transform:scale(.94)}

.app{max-width:560px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-left,0px)) 140px max(12px,env(safe-area-inset-right,0px))}

/* шапка */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 4px 18px}
.hdr > div:first-child{min-width:0}
.yr{border:0;background:transparent;color:var(--red);font-size:17px;font-weight:600;padding:0;display:flex;align-items:center;gap:2px;margin-bottom:2px;white-space:nowrap;text-align:left}
.yr svg{margin-left:-4px}
body.multi .yr{font-size:14px}
body.multi h1{font-size:30px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hb{display:flex;gap:8px;align-items:center;padding-bottom:2px}
.gb{height:40px;min-width:40px;border-radius:999px;display:grid;place-items:center;padding:0 14px;font-weight:600;font-size:15px}
.gb.ic{padding:0}

/* люди */
.people{display:flex;gap:8px;overflow-x:auto;padding:0 2px 18px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;border:0;background:var(--card);border-radius:999px;padding:7px 14px 7px 7px;font-weight:600;font-size:14px}
.chip .dot{width:20px;height:20px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="false"]{color:var(--dim);background:var(--chipOff)}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);opacity:.5}
.chip small{font-weight:500;color:var(--muted);font-size:12px}

/* приглашения */
.invs{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.inv{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 12px 12px 16px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.inv .who{font-size:13px;font-weight:600;color:var(--muted)}
.inv .what{font-weight:600;font-size:16px;line-height:1.3}
.inv .meta{font-size:13px;color:var(--muted)}
.invB{display:flex;gap:6px;margin-left:auto;flex:none}
.invB button{border:0;border-radius:999px;padding:9px 13px;font-weight:700;font-size:14px}
.invB .yes{background:var(--green);color:#fff}
.invB .no{background:var(--field)}
.inst{position:relative;display:flex;flex-direction:column;gap:8px;border-radius:20px;padding:14px 16px;
  border:2px solid #0A84FF;background:color-mix(in srgb,#0A84FF 12%,var(--card))}
.inst>b{color:#0A84FF;font-size:17px;padding-right:32px}
:root[data-theme="dark"] .inst>b{color:#409CFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .inst>b{color:#409CFF}}
.inst ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.inst .ico{display:inline-block;width:18px;height:18px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.inst .note{color:var(--muted);font-size:13px;margin:0}
.inst .lead{margin:0}
.inst .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--muted);font-size:24px;line-height:1}

/* месяц: лента */
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:0 0 8px}
.wd span:last-child{color:var(--red)}
.strip{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  scrollbar-width:none;margin:0 -12px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.mpanel{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{position:relative;border:0;background:var(--cell);border-radius:14px;aspect-ratio:1/1.14;padding:0;overflow:hidden;display:flex;justify-content:center;color:var(--ink)}
.day.filled{background:var(--bg)}
.bands{position:absolute;inset:0;display:flex;flex-direction:column;gap:2.5px}
.bands i{flex:1;display:block;border-radius:6px}
body.s1 .bands i{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff) 0%,color-mix(in srgb,var(--c) 72%,transparent) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.18)}
body.s2 .bands i{background:color-mix(in srgb,var(--c) 70%,transparent)}
body.s3 .bands i{background:color-mix(in srgb,var(--c) 58%,#fff)}
body.s3 .day.filled:not(.today) .n,body.s3 .md.filled{color:#1C1C1E;text-shadow:none}
.day .n{position:relative;z-index:1;margin-top:6px;height:26px;min-width:26px;padding:0 4px;border-radius:13px;display:grid;place-items:center;font-size:16px;font-weight:600}
.day.sun .n{color:var(--red)}
.day.filled .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.day.today .n{background:var(--red);color:#fff;text-shadow:none}
.day.out{opacity:.28}
.day.past:not(.out){opacity:.5}
.day.sel{outline:2px solid var(--ink);outline-offset:2px}
.day.free:not(.out)::after{content:"";position:absolute;bottom:9px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--green);box-shadow:0 0 8px color-mix(in srgb,var(--green) 60%,transparent)}
.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:14px 4px 0}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--green)}

/* панель дня */
.dp{margin-top:22px}
.dpHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 12px}
.dpHead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.tag{font-size:13px;font-weight:700;color:var(--greenInk);background:color-mix(in srgb,var(--green) 16%,transparent);border-radius:999px;padding:5px 11px;white-space:nowrap}
.ev{display:flex;gap:14px;align-items:center;width:100%;border:0;background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;margin-bottom:8px;color:var(--ink)}
.caps{display:flex;flex-direction:column;gap:3px;flex:none;align-self:stretch;justify-content:center}
.caps i{width:6px;flex:1;max-height:44px;min-height:10px;border-radius:3px;background:var(--c)}
.caps i.wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.ev .what .lock{color:var(--muted);margin-right:5px;vertical-align:-1px}
.ev .what{font-weight:600;font-size:16px;line-height:1.3}
.ev .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ev .chev{margin-left:auto;color:var(--dim);flex:none}
.freeLine{color:var(--muted);font-size:14px;padding:4px 6px}
.freeLine b{color:var(--greenInk);font-weight:600}
.emptyDay{color:var(--muted);text-align:center;padding:26px 12px;background:var(--card);border-radius:20px}

/* несколько месяцев */
.yg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
.mm{min-width:0}
.mmh{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap;border:0;background:transparent;font-size:17px;font-weight:700;padding:0 2px 8px;width:100%;text-align:left;color:var(--ink)}
.mm.cur .mmh span{color:var(--red)}
.mmh small{font-size:11px;font-weight:600;color:var(--greenInk)}
.mm.past{opacity:.45}
.md.pastd{opacity:.45}
.mmgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.md{position:relative;border:0;background:var(--cell);border-radius:5px;aspect-ratio:1;padding:0;font-size:9.5px;font-weight:600;display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.md.filled{background:var(--bg);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.md .bands{gap:1px}
.md .bands i{border-radius:3px}
.md .num{position:relative;z-index:1}
.md.sun{color:var(--red)}
.md.today .num{background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;display:grid;place-items:center;text-shadow:none}
.md.free::after{content:"";position:absolute;bottom:1px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--green)}
.yg.big .md{font-size:12px;border-radius:7px}
.yg.big .mmgrid{gap:3px}
.yg.big .md .bands{gap:1.5px}
.yg.big .md.today .num{width:19px;height:19px}
@media (min-width:540px){.yg{grid-template-columns:repeat(3,minmax(0,1fr))}.yg.big{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ближайшее и настройки */
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 4px 12px}
.frs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.fr{border:0;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--greenInk);font-weight:600;border-radius:999px;padding:9px 14px;font-size:14px}
.empty{color:var(--muted);padding:6px 4px 20px}
.set{background:var(--card);border-radius:20px;padding:2px 16px;margin-top:28px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.setRow:last-child{border-bottom:0}
.setRow .k{font-weight:600}
.setRow .v{color:var(--muted);font-size:13px;margin-top:1px}
.lnk{border:0;background:var(--field);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.lnk.on{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--greenInk)}
.seg{display:flex;background:var(--field);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.gbox{padding:0 14px}
.blk{margin-top:10px}
.gbox.blk .gic{background:color-mix(in srgb,var(--ic) 18%,transparent);color:var(--ic)}
.blkin .set{background:none;padding:0;margin:0;border-radius:0}
.blkin{padding-bottom:6px;border-top:.5px solid var(--line)}
.blkin .sec{display:none}
.gbox summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 0;cursor:pointer}
.gbox summary::-webkit-details-marker{display:none}
.gbox .gic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,#FFC671 30%,transparent);color:#B7791F;flex:none}
.gbox .gtt{display:flex;flex-direction:column;flex:1;min-width:0}.gbox .gtt small{color:var(--muted);font-size:12px}
.gbox .arr{color:var(--dim);transition:transform .2s}.gbox[open] .arr{transform:rotate(180deg)}
.gbody{display:flex;flex-direction:column;gap:16px;padding:2px 0 16px;-webkit-user-select:text;user-select:text}
.gsec{display:flex;flex-direction:column;gap:8px}.gsec>b{font-size:14px}
.gnote{font-size:12.5px;color:var(--muted);line-height:1.4}
.gflow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gex{background:var(--field);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;color:var(--muted);line-height:1.25}
.gex>span{display:flex;flex-direction:column}.gex b{color:var(--ink);font-size:12px}
.gday{position:relative;width:44px;height:48px;border-radius:12px;background:var(--cell);display:grid;place-items:center;overflow:hidden}
.gday .bands{position:absolute;inset:0;display:flex;flex-direction:column;gap:2px}.gday .bands i{flex:1;border-radius:6px;background:color-mix(in srgb,var(--c) 58%,#fff)}
.gday>b{grid-area:1/1;align-self:center;position:relative;font-size:15px;color:var(--ink)}.gday.filled>b{color:#1C1C1E}
.gday.over>b{text-shadow:0 0 2px var(--cell),0 0 3px var(--cell),1px 1px 0 var(--cell),-1px -1px 0 var(--cell),1px -1px 0 var(--cell),-1px 1px 0 var(--cell);color:var(--ink)}
.gsteps{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.gstep{min-width:32px;height:32px;padding:0 10px;border-radius:999px;background:var(--field);display:grid;place-items:center;font-weight:700;font-size:13px}
.gstep.ok{background:var(--green);color:#fff}.garr{color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gcard{background:var(--field);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;color:#0A84FF}
.gcard b{color:var(--ink);font-size:13px}.gcard span{color:var(--muted);font-size:11px;line-height:1.25}
.gwhere{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.gwhere span{background:var(--field);border-radius:14px;padding:9px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;line-height:1.3}
.gwhere svg{color:#0A84FF}.gwhere b{color:var(--ink);font-size:13px}
.gwarn{flex-direction:row;align-items:flex-start;gap:10px;background:color-mix(in srgb,#FFC671 22%,transparent);border-radius:14px;padding:11px;font-size:12.5px;line-height:1.45}
.gwarn svg{flex:none;color:#B7791F}
.gcta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:12px;font-weight:600;font-size:15px;background:color-mix(in srgb,#FFC671 28%,var(--card));color:var(--ink)}
.gcta svg{color:#B7791F}
.itv{display:flex;justify-content:center;align-items:center;gap:6px;margin:26px 0 0;color:var(--muted);font-weight:600;letter-spacing:.04em;font-size:14px}
.itv svg{width:20px;height:20px}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:9;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border-radius:999px;padding:4px 10px}

/* нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;justify-content:center;gap:10px;padding:0 14px;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;border-radius:999px;padding:5px;gap:2px}
.tab{border:0;background:transparent;border-radius:999px;width:58px;height:48px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{background:var(--sel);color:var(--ink)}
.fab{pointer-events:auto;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

/* шторка */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:544px;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glassBorder);border-radius:34px;padding:10px 18px 20px;box-shadow:var(--shadow);
  transform:translateY(calc(100% + 30px));transition:transform .34s cubic-bezier(.2,.9,.25,1);z-index:21;max-height:86vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--dim);opacity:.5;margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.015em}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 7px}
.whoPick{display:flex;flex-wrap:wrap;gap:7px}
.whoPick .chip{background:var(--field)}
.whoPick .chip[aria-pressed="false"]{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dbtn{width:100%;border:0;background:var(--field);border-radius:16px;padding:13px 14px;color:var(--ink);font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.dbtn.on{box-shadow:inset 0 0 0 2px var(--dim)}
.wheel{position:relative;display:grid;grid-template-columns:1.6fr 1fr;height:190px;margin-top:12px;border-radius:18px;background:var(--field);overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.wcol{overflow-y:auto;scroll-snap-type:y mandatory;padding-block:76px;scrollbar-width:none;overscroll-behavior:contain;position:relative;z-index:1}
.wcol::-webkit-scrollbar{display:none}
.wi{height:38px;display:grid;place-items:center;scroll-snap-align:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.wheel.time{grid-template-columns:1fr 1fr}
.wi small{font-size:12px;color:var(--muted);font-weight:600;margin-left:5px}
.wcol[data-col="d"] .wi{display:flex;align-items:baseline;justify-content:center;gap:6px}
.wcol[data-col="d"] .dw{margin:0;min-width:18px;text-align:left}
.wi.we .dw,.wi.we .dn{color:var(--red)}
.wi.dis{opacity:.25}
.runs{display:flex;flex-wrap:wrap;gap:6px}.runs span{background:var(--field);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
#pickBar{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:12;margin:0 auto;max-width:520px;
  display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:999px}
#pickN{flex:1;font-weight:600;font-size:14px}
#pickBar .lnk{padding:9px 14px}
.day.picked{outline:3px solid var(--ink);outline-offset:-3px}
.day.picked::before{content:"✓";position:absolute;top:4px;right:6px;z-index:2;font-size:11px;font-weight:800;color:var(--ink)}
body.picking .fab,body.picking .tabbar{opacity:.35;pointer-events:none}
.wband{position:absolute;left:8px;right:8px;top:76px;height:38px;border-radius:11px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:0}
input.in{width:100%;border:0;background:var(--field);border-radius:16px;padding:13px 14px;font-weight:500;min-width:0}
input.in:focus{outline:2px solid var(--dim);outline-offset:0}
.err{color:var(--red);font-weight:600;font-size:14px;margin:10px 4px 0}
.hint{color:var(--muted);font-size:14px;margin:4px 4px 0}
.plist{background:var(--field);border-radius:16px;padding:2px 14px;margin-top:16px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.prow .st{margin-left:auto;color:var(--muted);font-size:14px}
.prow .v{color:var(--muted);font-size:13px}
.set .prow{border-bottom:.5px solid var(--line);padding:11px 0}
.set .prow .st{display:flex;gap:6px;flex:none}
.set .prow .lnk{padding:7px 11px;font-size:13px}
.setRow.knock .in{flex:1;padding:10px 12px;font-size:16px}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.cl{width:36px;height:36px;border-radius:50%;border:0;background:var(--c)}
.cl[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.tsel{border:0;background:var(--field);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;font-weight:600;color:var(--ink)}
.tsel:disabled{opacity:.4}
.nickin{display:flex;align-items:center;background:var(--field);border-radius:16px;padding-left:14px}
.nickin span{color:var(--muted);font-weight:600;font-size:16px}
.nickin .in{background:transparent;padding-left:3px}
.msgbox{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;font-family:inherit;font-size:14px;line-height:1.4;max-height:220px;overflow:auto}
.todo{margin:14px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.todo li{line-height:1.35}.todo li::marker{font-weight:700;color:var(--muted)}
.todo b{display:block}.todo span{display:block;color:var(--muted);font-size:13px}
.todo .lnk{margin-top:6px}.todo .keybox{margin-top:6px;font-size:13px;padding:10px 12px}
.keybox{background:var(--field);border-radius:14px;padding:13px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;word-break:break-all;-webkit-user-select:all;user-select:all}
.sheet .seg{width:max-content;max-width:100%}
#admLink{width:22px;height:22px;flex:none;accent-color:var(--green)}
.btn{border:0;border-radius:999px;padding:15px;font-weight:700;font-size:16px;width:100%;background:var(--ink);color:var(--bg);margin-top:18px}
.btn.ok{background:var(--green);color:#fff}
.btn.ghost{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);margin-top:8px}
.btn.plain{background:var(--field);color:var(--ink);margin-top:8px}

/* уведомление */
.toast{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));margin:0 auto;max-width:440px;
  border-radius:26px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.25,1);z-index:30}
.toast.show{transform:none}
.toast .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#FF6961,#FF375F);display:grid;place-items:center;flex:none}
.toast .t1{font-size:12px;font-weight:600;color:var(--muted)}
.toast .t2{font-weight:600;line-height:1.3;font-size:14px}


/* ===== раскладка обзора: столбик ===== */
body.lay-col .yg.big{grid-template-columns:minmax(0,1fr);gap:26px}
body.lay-col .yg.big .md{font-size:14px;border-radius:10px;aspect-ratio:1/0.92}
body.lay-col .yg.big .mmgrid{gap:4px}
body.lay-col .yg.big .md .bands{gap:2px}
body.lay-col .yg.big .md .bands i{border-radius:5px}
body.lay-col .yg.big .md.today .num{width:24px;height:24px}
body.lay-col .yg.big .md.free::after{width:5px;height:5px;margin-left:-2.5px;bottom:3px}
body.lay-col .yg.big .mmh{flex-direction:row;align-items:baseline;gap:10px;font-size:20px}
body.lay-col .yg.big .mmh small{font-size:13px}

/* переключатель вида (только демо) */
.skinBtn{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:11;
  border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;background:var(--ink);color:var(--bg);opacity:.85}

/* ===== One UI ===== */
body.skin-oneui{--bg:#F4F4F6;--card:#FFFFFF;--cell:#F1F1F4;--acc:#3E91FF;--accInk:#0B6CF0;--red:#F23D3D;
  --field:rgba(0,0,0,.05);--glass:#FFFFFF;--sheet:#FFFFFF;--sel:color-mix(in srgb,#3E91FF 14%,transparent);--chipOff:#E9E9EC;
  font-family:"Samsung One","SamsungOne","Samsung Sans","Roboto Flex",Roboto,system-ui,sans-serif}
:root.dk body.skin-oneui{--bg:#000000;--card:#171717;--cell:#232323;--accInk:#6AAEFF;--field:rgba(255,255,255,.08);
  --glass:#171717;--sheet:#1C1C1C;--sel:color-mix(in srgb,#3E91FF 26%,transparent);--chipOff:#0E0E0E}
body.skin-oneui .hdr{flex-direction:column;align-items:stretch;gap:20px;padding:max(11vh,64px) 6px 22px}
body.skin-oneui h1{font-size:40px;font-weight:700;letter-spacing:-.01em}
body.skin-oneui .yr{color:var(--muted);font-size:15px;margin-bottom:6px}
body.skin-oneui.multi h1{font-size:40px}
body.skin-oneui.multi .yr{font-size:15px}
body.skin-oneui .hb{justify-content:flex-end}
body.skin-oneui .gb{background:var(--card);box-shadow:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;height:38px}
body.skin-oneui .chip{padding:6px 12px 6px 6px;font-size:13px}
body.skin-oneui .chip .dot{width:16px;height:16px}
body.skin-oneui .mm,body.skin-oneui #vMonth,body.skin-oneui .inv,body.skin-oneui .inst{background:var(--card);border-radius:26px}
body.skin-oneui .mm{padding:14px 12px 12px}
body.skin-oneui .yg{gap:12px}
body.skin-oneui #vMonth{padding:14px 12px 16px}
body.skin-oneui .strip{margin:0 -12px}
body.skin-oneui .day{border-radius:12px}
body.skin-oneui .day.today .n,body.skin-oneui .md.today .num{background:var(--acc)}
body.skin-oneui .mm.cur .mmh span{color:var(--accInk)}
body.skin-oneui .day.sel{outline-color:var(--acc)}
body.skin-oneui .dp{margin:16px -12px 0;padding:16px 12px 0;border-top:1px solid var(--line)}
body.skin-oneui .ev,body.skin-oneui .emptyDay{background:var(--cell)}
body.skin-oneui #vList .ev{background:var(--card)}
body.skin-oneui .inv{border:0}
body.skin-oneui .inst{border:0;background:color-mix(in srgb,#3E91FF 12%,var(--card))}
body.skin-oneui .invB .yes,body.skin-oneui .btn.ok{background:var(--acc)}
body.skin-oneui .btn{background:var(--acc);color:#fff}
body.skin-oneui .seg button[aria-pressed="true"]{background:var(--acc);color:#fff;box-shadow:none}
body.skin-oneui .lnk{color:var(--accInk)}
body.skin-oneui .dock{bottom:0;padding:0;gap:0;justify-content:stretch;background:var(--card);
  padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--line)}
body.skin-oneui .tabbar{flex:1;border-radius:0;padding:8px max(10px,env(safe-area-inset-left,0px));justify-content:space-around;
  background:transparent;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
body.skin-oneui .tab{width:64px;height:36px}
body.skin-oneui .tab[aria-selected="true"]{background:var(--sel);color:var(--accInk)}
body.skin-oneui .fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:18px;background:var(--acc);color:#fff;border:0;box-shadow:0 6px 18px rgba(0,0,0,.18);
  -webkit-backdrop-filter:none;backdrop-filter:none}
body.skin-oneui .skinBtn{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body.skin-oneui .sheet{left:0;right:0;bottom:0;border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  -webkit-backdrop-filter:none;backdrop-filter:none;border:0}
body.skin-oneui .toast{border-radius:22px;background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}

/* лента месяцев */
#top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);margin:calc(-1 * env(safe-area-inset-top,0px)) -12px 0;padding:env(safe-area-inset-top,0px) 12px 0}
#top::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px;pointer-events:none;background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 60%,transparent),transparent)}
body.feed .hdr{padding:10px 4px 12px}
#topWd{padding:0 0 8px}
body.feed .hdr h1{font-size:30px}
.mblock{margin-bottom:26px}
.mtitle{margin:0 4px 10px;font-size:22px;font-weight:700;letter-spacing:-.015em}
.mtitle small{font-size:15px;color:var(--muted);font-weight:600}
.mblock.cur .mtitle{color:var(--red)}
#feed .mblock:first-child .mtitle{display:none}
body.skin-oneui .mblock.cur .mtitle{color:var(--accInk)}
body.skin-oneui #vMonth{background:transparent;padding:0}
body.skin-oneui .mblock{background:var(--card);border-radius:26px;padding:14px 10px 12px}
body.skin-oneui #feed .mblock:first-child{padding-top:12px}
body.feed.skin-oneui .hdr{flex-direction:row;align-items:flex-end;gap:10px}
.mblock .grid > span{aspect-ratio:1/1.14}
.more{display:block;margin:0 auto 10px;border:0;background:var(--field);border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;color:var(--muted)}
.day.free::after,.md.free::after{display:none}
.sheet .dpHead{margin:0 0 12px}
.sheet .ev{background:var(--field)}
.sheet .emptyDay{background:var(--field)}
/* год: 3 колонки */
.yg.y3{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px}
.yg.y3 .mmh{font-size:12.5px;padding-bottom:6px;flex-direction:row;align-items:baseline;gap:4px;overflow:hidden}
.yg.y3 .mmh small{font-size:10px;color:var(--muted);font-weight:600}
.yg.y3 .md{font-size:8px;border-radius:3px}
.yg.y3 .md:not(.filled){background:transparent}
.yg.y3 .mmgrid{gap:1.5px}
.yg.y3 .md .bands{gap:.5px}
.yg.y3 .md .bands i{border-radius:2px}
.yg.y3 .md.today .num{width:12px;height:12px}
@media (min-width:540px){.yg.y3{grid-template-columns:repeat(3,minmax(0,1fr))}.yg.y3 .md{font-size:10px}}
/* цифра дня поверх полос — на плашке, чтобы не сливалась */
.day{align-items:center}
.day .n{margin:0;width:30px;height:30px;min-width:0;padding:0;border-radius:50%;line-height:1;font-size:16px}
.day.filled.over:not(.today) .n,body.s3 .day.filled.over:not(.today) .n{background:none;color:var(--ink);font-weight:700;text-shadow:0 0 1px var(--cell),0 0 2px var(--cell),0 0 3px var(--cell),0 0 4px var(--cell),1px 1px 0 var(--cell),-1px -1px 0 var(--cell),1px -1px 0 var(--cell),-1px 1px 0 var(--cell)}
.day.filled.sun:not(.today) .n{color:var(--red)}
.md.filled.over:not(.today) .num,body.s3 .md.filled.over:not(.today) .num{background:none;color:var(--ink);font-weight:700;text-shadow:0 0 1px var(--cell),0 0 2px var(--cell),1px 0 0 var(--cell),-1px 0 0 var(--cell),0 1px 0 var(--cell),0 -1px 0 var(--cell)}
.md.filled.sun:not(.today) .num{color:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <div id="top"><header class="hdr" id="hdr">
    <div>
      <button class="yr" id="yr" data-act="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span id="yrText"></span>
      </button>
      <h1 id="title"></h1>
    </div>
    <div class="hb" id="hb">
      <button class="gb ic glass press" data-act="prev" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="gb glass press" data-act="today">Сегодня</button>
      <button class="gb ic glass press" data-act="next" aria-label="Вперёд"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <div class="wd" id="topWd" hidden><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div></div>

  <div class="invs" id="invs"></div>
  <div class="people" id="people"></div>

  <section id="vMonth">
    <div id="feed"></div>
  </section>

  <section id="vYear" hidden><div class="yg" id="yearGrid"></div></section>
  <section id="vList" hidden></section>
  <section id="vSet" hidden></section>
</div>

<nav class="dock">
  <div class="tabbar glass" role="tablist">
    <button class="tab press" data-view="month" role="tab" aria-label="Месяц" title="Месяц">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <button class="tab press" data-view="year" role="tab" aria-label="Год" title="Год">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="5.5" r="2.3"/><circle cx="12" cy="5.5" r="2.3"/><circle cx="18.5" cy="5.5" r="2.3"/><circle cx="5.5" cy="12" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="18.5" cy="12" r="2.3"/><circle cx="5.5" cy="18.5" r="2.3"/><circle cx="12" cy="18.5" r="2.3"/><circle cx="18.5" cy="18.5" r="2.3"/></svg></button>
    <button class="tab press" data-view="list" role="tab" aria-label="Ближайшее" title="Ближайшее">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.2" fill="currentColor"/><circle cx="4.6" cy="12" r="1.2" fill="currentColor"/><circle cx="4.6" cy="17.5" r="1.2" fill="currentColor"/></svg></button>
    <button class="tab press" data-view="set" role="tab" aria-label="Настройки" title="Настройки">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <button class="fab glass press" data-act="add" aria-label="Добавить дело">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</nav>

<div id="pickBar" class="glass" hidden><span id="pickN"></span><button class="lnk press" data-act="pickCancel">Отмена</button><button class="lnk on press" data-act="pickSave">Записать</button></div>
<div class="sync" id="sync" hidden></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast glass" id="toast" role="status">
  <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
  <div><div class="t1" id="toastT1"></div><div class="t2" id="toastT2"></div></div>
</div>

<script src="app.js?v=33"></script>
</body>
</html>
