<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Кто когда</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Кто когда">
<style>
/* Тема: светлая по умолчанию, тёмная по системе или data-theme */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --card:#FFFFFF; --field:rgba(118,118,128,.12);
  --ink:#000000; --muted:#6C6C70; --dim:#8E8E93; --red:#FF3B30; --green:#34C759; --greenInk:#248A3D;
  --glass:rgba(250,250,252,.72); --glassBorder:rgba(0,0,0,.08); --sheet:rgba(250,250,252,.94);
  --sel:rgba(0,0,0,.07); --chipOff:#E5E5EA; --line:rgba(60,60,67,.14);
  --shadow:0 10px 30px rgba(0,0,0,.12); --gloss:rgba(255,255,255,.6); --itv:#FF2E93;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#151517; --card:#1C1C1E; --field:rgba(255,255,255,.08);
  --ink:#F5F5F7; --muted:#8E8E93; --dim:#636366; --red:#FF453A; --green:#30D158; --greenInk:#30D158;
  --glass:rgba(38,38,42,.58); --glassBorder:rgba(255,255,255,.13); --sheet:rgba(32,32,36,.88);
  --sel:rgba(255,255,255,.14); --chipOff:#0E0E10; --line:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.55); --gloss:rgba(255,255,255,.10); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#151517; --card:#1C1C1E; --field:rgba(255,255,255,.08);
  --ink:#F5F5F7; --muted:#8E8E93; --dim:#636366; --red:#FF453A; --green:#30D158; --greenInk:#30D158;
  --glass:rgba(38,38,42,.58); --glassBorder:rgba(255,255,255,.13); --sheet:rgba(32,32,36,.88);
  --sel:rgba(255,255,255,.14); --chipOff:#0E0E10; --line:rgba(255,255,255,.08);
  --shadow:0 10px 34px rgba(0,0,0,.55); --gloss:rgba(255,255,255,.10); color-scheme:dark}

html{touch-action:manipulation;-webkit-text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh;
  font-family:-apple-system,system-ui,"SF Pro Text","Google Sans","Roboto Flex",Roboto,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:background-color .3s}
button,input{font:inherit;color:inherit}
input{font-size:16px;-webkit-user-select:text;user-select:text}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.num,.n,.md .num,.mmh small{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid var(--glassBorder);box-shadow:inset 0 1px 0 var(--gloss),var(--shadow)}
.press{transition:transform .16s cubic-bezier(.3,.7,.4,1)}
.press:active{transform:scale(.94)}

.app{max-width:560px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-left,0px)) 140px max(12px,env(safe-area-inset-right,0px))}

/* шапка */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 4px 18px}
.hdr > div:first-child{min-width:0}
.yr{border:0;background:transparent;color:var(--red);font-size:17px;font-weight:600;padding:0;display:flex;align-items:center;gap:2px;margin-bottom:2px;white-space:nowrap;text-align:left}
.yr svg{margin-left:-4px}
body.multi .yr{font-size:14px}
body.multi h1{font-size:30px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hb{display:flex;gap:8px;align-items:center;padding-bottom:2px}
.gb{height:40px;min-width:40px;border-radius:999px;display:grid;place-items:center;padding:0 14px;font-weight:600;font-size:15px}
.gb.ic{padding:0}

/* люди */
.people{display:flex;gap:8px;overflow-x:auto;padding:0 2px 18px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;border:0;background:var(--card);border-radius:999px;padding:7px 14px 7px 7px;font-weight:600;font-size:14px}
.chip .dot{width:20px;height:20px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="false"]{color:var(--dim);background:var(--chipOff)}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);opacity:.5}
.chip small{font-weight:500;color:var(--muted);font-size:12px}

/* приглашения */
.invs{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.inv{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:20px;padding:12px 12px 12px 16px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent)}
.inv .who{font-size:13px;font-weight:600;color:var(--muted)}
.inv .what{font-weight:600;font-size:16px;line-height:1.3}
.inv .meta{font-size:13px;color:var(--muted)}
.invB{display:flex;gap:6px;margin-left:auto;flex:none}
.invB button{border:0;border-radius:999px;padding:9px 13px;font-weight:700;font-size:14px}
.invB .yes{background:var(--green);color:#fff}
.invB .no{background:var(--field)}

/* месяц: лента */
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:0 0 8px}
.wd span:last-child{color:var(--red)}
.strip{display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;
  scrollbar-width:none;margin:0 -12px;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.mpanel{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;padding:2px 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{position:relative;border:0;background:var(--cell);border-radius:14px;aspect-ratio:1/1.14;padding:0;overflow:hidden;display:flex;justify-content:center;color:var(--ink)}
.day.filled{background:var(--bg)}
.bands{position:absolute;inset:0;display:flex;flex-direction:column;gap:2.5px}
.bands i{flex:1;display:block;border-radius:6px}
body.s1 .bands i{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff) 0%,color-mix(in srgb,var(--c) 72%,transparent) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.18)}
body.s2 .bands i{background:color-mix(in srgb,var(--c) 70%,transparent)}
body.s3 .bands i{background:color-mix(in srgb,var(--c) 58%,#fff)}
body.s3 .day.filled:not(.today) .n,body.s3 .md.filled{color:#1C1C1E;text-shadow:none}
.day .n{position:relative;z-index:1;margin-top:6px;height:26px;min-width:26px;padding:0 4px;border-radius:13px;display:grid;place-items:center;font-size:16px;font-weight:600}
.day.sun .n{color:var(--red)}
.day.filled .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.day.today .n{background:var(--red);color:#fff;text-shadow:none}
.day.out{opacity:.28}
.day.past:not(.out){opacity:.5}
.day.sel{outline:2px solid var(--ink);outline-offset:2px}
.day.free:not(.out)::after{content:"";position:absolute;bottom:9px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--green);box-shadow:0 0 8px color-mix(in srgb,var(--green) 60%,transparent)}
.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:14px 4px 0}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--green)}

/* панель дня */
.dp{margin-top:22px}
.dpHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 12px}
.dpHead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.tag{font-size:13px;font-weight:700;color:var(--greenInk);background:color-mix(in srgb,var(--green) 16%,transparent);border-radius:999px;padding:5px 11px;white-space:nowrap}
.ev{display:flex;gap:14px;align-items:center;width:100%;border:0;background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;margin-bottom:8px;color:var(--ink)}
.caps{display:flex;flex-direction:column;gap:3px;flex:none;align-self:stretch;justify-content:center}
.caps i{width:6px;flex:1;max-height:44px;min-height:10px;border-radius:3px;background:var(--c)}
.caps i.wait{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.ev .what{font-weight:600;font-size:16px;line-height:1.3}
.ev .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ev .chev{margin-left:auto;color:var(--dim);flex:none}
.freeLine{color:var(--muted);font-size:14px;padding:4px 6px}
.freeLine b{color:var(--greenInk);font-weight:600}
.emptyDay{color:var(--muted);text-align:center;padding:26px 12px;background:var(--card);border-radius:20px}

/* несколько месяцев */
.yg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
.mm{min-width:0}
.mmh{display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap;border:0;background:transparent;font-size:17px;font-weight:700;padding:0 2px 8px;width:100%;text-align:left;color:var(--ink)}
.mm.cur .mmh span{color:var(--red)}
.mmh small{font-size:11px;font-weight:600;color:var(--greenInk)}
.mm.past{opacity:.45}
.md.pastd{opacity:.45}
.mmgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.md{position:relative;border:0;background:var(--cell);border-radius:5px;aspect-ratio:1;padding:0;font-size:9.5px;font-weight:600;display:grid;place-items:center;overflow:hidden;color:var(--ink)}
.md.filled{background:var(--bg);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.md .bands{gap:1px}
.md .bands i{border-radius:3px}
.md .num{position:relative;z-index:1}
.md.sun{color:var(--red)}
.md.today .num{background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;display:grid;place-items:center;text-shadow:none}
.md.free::after{content:"";position:absolute;bottom:1px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--green)}
.yg.big .md{font-size:12px;border-radius:7px}
.yg.big .mmgrid{gap:3px}
.yg.big .md .bands{gap:1.5px}
.yg.big .md.today .num{width:19px;height:19px}
@media (min-width:540px){.yg{grid-template-columns:repeat(3,minmax(0,1fr))}.yg.big{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ближайшее и настройки */
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 4px 12px}
.frs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.fr{border:0;background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--greenInk);font-weight:600;border-radius:999px;padding:9px 14px;font-size:14px}
.empty{color:var(--muted);padding:6px 4px 20px}
.set{background:var(--card);border-radius:20px;padding:2px 16px;margin-top:28px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:.5px solid var(--line)}
.setRow:last-child{border-bottom:0}
.setRow .k{font-weight:600}
.setRow .v{color:var(--muted);font-size:13px;margin-top:1px}
.lnk{border:0;background:var(--field);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.lnk.on{background:color-mix(in srgb,var(--green) 18%,transparent);color:var(--greenInk)}
.seg{display:flex;background:var(--field);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.itv{display:flex;justify-content:center;align-items:center;gap:6px;margin:26px 0 0;color:var(--muted);font-weight:600;letter-spacing:.04em;font-size:14px}
.itv svg{width:20px;height:20px}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:9;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border-radius:999px;padding:4px 10px}

/* нижняя панель */
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;justify-content:center;gap:10px;padding:0 14px;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;border-radius:999px;padding:5px;gap:2px}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-width:58px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--sel);color:var(--ink)}
.fab{pointer-events:auto;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}

/* шторка */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:544px;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glassBorder);border-radius:34px;padding:10px 18px 20px;box-shadow:var(--shadow);
  transform:translateY(calc(100% + 30px));transition:transform .34s cubic-bezier(.2,.9,.25,1);z-index:21;max-height:86vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet.drag{transition:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--dim);opacity:.5;margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.015em}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 7px}
.whoPick{display:flex;flex-wrap:wrap;gap:7px}
.whoPick .chip{background:var(--field)}
.whoPick .chip[aria-pressed="false"]{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.in{width:100%;border:0;background:var(--field);border-radius:16px;padding:13px 14px;font-weight:500;min-width:0}
input.in:focus{outline:2px solid var(--dim);outline-offset:0}
.err{color:var(--red);font-weight:600;font-size:14px;margin:10px 4px 0}
.hint{color:var(--muted);font-size:14px;margin:4px 4px 0}
.plist{background:var(--field);border-radius:16px;padding:2px 14px;margin-top:16px}
.prow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.prow .st{margin-left:auto;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:999px;padding:15px;font-weight:700;font-size:16px;width:100%;background:var(--ink);color:var(--bg);margin-top:18px}
.btn.ok{background:var(--green);color:#fff}
.btn.ghost{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red);margin-top:8px}
.btn.plain{background:var(--field);color:var(--ink);margin-top:8px}

/* уведомление */
.toast{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));margin:0 auto;max-width:440px;
  border-radius:26px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.25,1);z-index:30}
.toast.show{transform:none}
.toast .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#FF6961,#FF375F);display:grid;place-items:center;flex:none}
.toast .t1{font-size:12px;font-weight:600;color:var(--muted)}
.toast .t2{font-weight:600;line-height:1.3;font-size:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div>
      <button class="yr" id="yr" data-act="back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span id="yrText"></span>
      </button>
      <h1 id="title"></h1>
    </div>
    <div class="hb" id="hb">
      <button class="gb ic glass press" data-act="prev" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="gb glass press" data-act="today">Сегодня</button>
      <button class="gb ic glass press" data-act="next" aria-label="Вперёд"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <div class="invs" id="invs"></div>
  <div class="people" id="people"></div>

  <section id="vMonth">
    <div class="wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="strip" id="strip"></div>
    <div class="legend"><i></i>все отмеченные свободны</div>
    <div class="dp" id="dayPanel"></div>
  </section>

  <section id="vYear" hidden><div class="yg" id="yearGrid"></div></section>
  <section id="vList" hidden></section>
</div>

<nav class="dock">
  <div class="tabbar glass" role="tablist">
    <button class="tab press" data-view="four" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>4 месяца</button>
    <button class="tab press" data-view="month" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Месяц</button>
    <button class="tab press" data-view="year" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="1.8"/><circle cx="12" cy="6" r="1.8"/><circle cx="18" cy="6" r="1.8"/><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/><circle cx="6" cy="18" r="1.8"/><circle cx="12" cy="18" r="1.8"/><circle cx="18" cy="18" r="1.8"/></svg>Год</button>
    <button class="tab press" data-view="list" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.2" fill="currentColor"/><circle cx="4.6" cy="12" r="1.2" fill="currentColor"/><circle cx="4.6" cy="17.5" r="1.2" fill="currentColor"/></svg>Ближайшее</button>
  </div>
  <button class="fab glass press" data-act="add" aria-label="Добавить дело">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
