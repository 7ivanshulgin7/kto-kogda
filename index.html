<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Кто когда</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кто когда">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --cell:#151517; --card:#1C1C1E; --field:rgba(255,255,255,.08);
  --ink:#F5F5F7; --muted:#8E8E93; --dim:#636366; --red:#FF453A; --green:#30D158;
  --glass:rgba(38,38,42,.58); --glassBorder:rgba(255,255,255,.13);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"SF Pro Text","Google Sans","Roboto Flex",Roboto,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid var(--glassBorder);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 34px rgba(0,0,0,.55)}
.press{transition:transform .16s cubic-bezier(.3,.7,.4,1)}
.press:active{transform:scale(.94)}

.app{max-width:560px;margin:0 auto;padding:8px 12px 140px}

/* header */
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px 4px 18px}
.yr{border:0;background:transparent;color:var(--red);font-size:17px;font-weight:600;padding:0;display:flex;align-items:center;gap:2px;margin-bottom:2px;white-space:nowrap;text-align:left}
.hdr > div:first-child{min-width:0}
body.multi .yr{font-size:14px}
body.multi h1{font-size:30px}
.yr svg{margin-left:-4px}
h1{margin:0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hb{display:flex;gap:8px;align-items:center;padding-bottom:2px}
.gb{height:40px;min-width:40px;border-radius:999px;display:grid;place-items:center;padding:0 14px;font-weight:600;font-size:15px}
.gb.ic{padding:0}

/* people */
.people{display:flex;gap:8px;overflow-x:auto;padding:0 2px 18px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:8px;flex:none;border:0;background:var(--card);border-radius:999px;padding:7px 14px 7px 7px;font-weight:600;font-size:14px}
.chip .dot{width:20px;height:20px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{color:var(--dim);background:#0E0E10}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c);opacity:.5}

/* month */
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:0 0 8px}
.wd span:last-child{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{position:relative;border:0;background:var(--cell);border-radius:14px;aspect-ratio:1/1.14;padding:0;overflow:hidden;display:flex;justify-content:center}
.day.filled{background:var(--bg)}
.bands{position:absolute;inset:0;display:flex;flex-direction:column;gap:2.5px}
.bands i{flex:1;display:block;border-radius:6px}
/* стиль 1: стекло */
body.s1 .bands i{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff) 0%,color-mix(in srgb,var(--c) 72%,transparent) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(0,0,0,.18)}
/* стиль 2: матовый */
body.s2 .bands i{background:color-mix(in srgb,var(--c) 70%,transparent)}
/* стиль 3: пастель */
body.s3 .bands i{background:color-mix(in srgb,var(--c) 58%,#fff)}
body.s3 .day.filled:not(.today) .n,body.s3 .md.filled{color:#1C1C1E;text-shadow:none}
.styleSw{display:flex;align-items:center;gap:8px;margin:16px 2px 0;font-size:13px;color:var(--muted)}
.seg{display:flex;background:var(--card);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.16);color:#fff}
.day .n{position:relative;z-index:1;margin-top:6px;height:26px;min-width:26px;padding:0 4px;border-radius:13px;display:grid;place-items:center;font-size:16px;font-weight:600}
.day.sun .n{color:var(--red)}
.day.filled .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.day.today .n{background:var(--red);color:#fff;text-shadow:none}
.day.out{opacity:.28}
.day.past:not(.out){opacity:.5}
.day.sel{outline:2px solid #fff;outline-offset:2px}
.day.free:not(.out)::after{content:"";position:absolute;bottom:9px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(48,209,88,.6)}
.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;padding:14px 4px 0}
.legend i{width:7px;height:7px;border-radius:50%;background:var(--green)}

/* day panel */
.dp{margin-top:22px}
.dpHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 12px}
.dpHead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.015em}
.tag{font-size:13px;font-weight:700;color:var(--green);background:rgba(48,209,88,.14);border-radius:999px;padding:5px 11px;white-space:nowrap}
.ev{display:flex;gap:14px;align-items:center;width:100%;border:0;background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;margin-bottom:8px}
.caps{display:flex;flex-direction:column;gap:3px;flex:none;align-self:stretch;justify-content:center}
.caps i{width:6px;flex:1;max-height:44px;min-height:10px;border-radius:3px;background:var(--c)}
.ev .what{font-weight:600;font-size:16px;line-height:1.3}
.ev .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ev .chev{margin-left:auto;color:var(--dim)}
.freeLine{color:var(--muted);font-size:14px;padding:4px 6px}
.freeLine b{color:var(--green);font-weight:600}
.emptyDay{color:var(--muted);text-align:center;padding:26px 12px;background:var(--card);border-radius:20px}

/* year */
.yg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
.mmh{display:flex;flex-direction:column;align-items:flex-start;gap:0;white-space:nowrap;border:0;background:transparent;font-size:17px;font-weight:700;padding:0 2px 8px;width:100%;text-align:left}
.mm.cur .mmh span{color:var(--red)}
.mmh small{font-size:11px;font-weight:600;color:var(--green)}
.mm.past{opacity:.45}
.md.pastd{opacity:.45}
.yg.half .md{font-size:11px;border-radius:6px}
.yg.half .md .bands{gap:1.5px}
.mmgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.md{position:relative;border:0;background:var(--cell);border-radius:5px;aspect-ratio:1;padding:0;font-size:9.5px;font-weight:600;display:grid;place-items:center;overflow:hidden}
.md.filled{background:var(--bg)}
.md .bands{gap:1px}
.md .bands i{border-radius:3px}
.md .num{position:relative;z-index:1}
.md.sun{color:var(--red)}
.md.filled{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.md.today .num{background:var(--red);color:#fff;border-radius:50%;width:15px;height:15px;display:grid;place-items:center;text-shadow:none}
.md.free::after{content:"";position:absolute;bottom:1px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--green)}
@media (min-width:540px){.yg{grid-template-columns:repeat(3,minmax(0,1fr))}.yg.half{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* upcoming */
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:4px 4px 12px}
.frs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.fr{border:0;background:rgba(48,209,88,.14);color:var(--green);font-weight:600;border-radius:999px;padding:9px 14px;font-size:14px}
.empty{color:var(--muted);padding:6px 4px 20px}
.reset{margin-top:20px;border:0;background:transparent;color:var(--dim);font-weight:500;padding:12px;width:100%}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;justify-content:center;gap:10px;padding:0 14px;pointer-events:none}
.tabbar{pointer-events:auto;display:flex;border-radius:999px;padding:5px;gap:2px}
.tab{border:0;background:transparent;border-radius:999px;padding:7px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);min-width:58px;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:rgba(255,255,255,.14);color:#fff}
.fab{pointer-events:auto;flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;border:.5px solid var(--glassBorder)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:544px;
  background:rgba(32,32,36,.86);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:.5px solid var(--glassBorder);border-radius:34px;padding:10px 18px 20px;
  transform:translateY(calc(100% + 30px));transition:transform .34s cubic-bezier(.2,.9,.25,1);z-index:21;max-height:86vh;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:-.015em}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 7px}
.whoPick{display:flex;flex-wrap:wrap;gap:7px}
.whoPick .chip{background:var(--field)}
.whoPick .chip[aria-pressed="false"]{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.in{width:100%;border:0;background:var(--field);border-radius:16px;padding:13px 14px;font-size:16px;font-weight:500;min-width:0}
input.in:focus{outline:2px solid rgba(255,255,255,.5);outline-offset:0}
.err{color:var(--red);font-weight:600;font-size:14px;margin:10px 4px 0}
.btn{border:0;border-radius:999px;padding:15px;font-weight:700;font-size:16px;width:100%;background:#fff;color:#000;margin-top:18px}
.btn.ghost{background:rgba(255,69,58,.14);color:var(--red);margin-top:8px}

/* toast */
.toast{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));margin:0 auto;max-width:440px;
  border-radius:26px;padding:12px 14px;display:flex;gap:12px;align-items:center;
  transform:translateY(-160%);transition:transform .4s cubic-bezier(.2,.9,.25,1);z-index:30}
.toast.show{transform:none}
.toast .ic{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,#FF6961,#FF375F);display:grid;place-items:center;flex:none}
.toast .t1{font-size:12px;font-weight:600;color:rgba(255,255,255,.6)}
.toast .t2{font-weight:600;line-height:1.3;font-size:14px}

/* settings / sync */
.set{background:var(--card);border-radius:20px;padding:4px 16px;margin-top:28px}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:.5px solid rgba(255,255,255,.08)}
.setRow:last-child{border-bottom:0}
.setRow .k{font-weight:600}
.setRow .v{color:var(--muted);font-size:13px;margin-top:1px}
.lnk{border:0;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.lnk.on{background:rgba(48,209,88,.16);color:var(--green)}
.sync{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:9;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border-radius:999px;padding:4px 10px}
.hint{color:var(--muted);font-size:14px;margin:6px 4px 0}
@media (prefers-reduced-motion:reduce){.sheet,.backdrop,.toast,.press,.tab{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div>
      <button class="yr" id="yr" data-act="toYear">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span id="yrText"></span>
      </button>
      <h1 id="title"></h1>
    </div>
    <div class="hb" id="hb">
      <button class="gb ic glass press" data-act="prev" aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="gb glass press" data-act="today">Сегодня</button>
      <button class="gb ic glass press" data-act="next" aria-label="Вперёд"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <div class="people" id="people"></div>

  <section id="vMonth">
    <div class="wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><i></i>все отмеченные свободны</div>
    <div class="styleSw">Вид полос<div class="seg" id="seg"><button data-style="s1">Стекло</button><button data-style="s2">Матовый</button><button data-style="s3">Пастель</button></div></div>
    <div class="dp" id="dayPanel"></div>
  </section>

  <section id="vYear" hidden><div class="yg" id="yearGrid"></div></section>
  <section id="vList" hidden></section>
</div>

<nav class="dock">
  <div class="tabbar glass" role="tablist">
    <button class="tab press" data-view="month" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Месяц</button>
    <button class="tab press" data-view="half" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="6.5" rx="2"/><rect x="4" y="13.5" width="16" height="6.5" rx="2"/></svg>Полгода</button>
    <button class="tab press" data-view="year" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg>Год</button>
    <button class="tab press" data-view="list" role="tab">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1.2" fill="currentColor"/><circle cx="4.6" cy="12" r="1.2" fill="currentColor"/><circle cx="4.6" cy="17.5" r="1.2" fill="currentColor"/></svg>Ближайшее</button>
  </div>
  <button class="fab glass press" data-act="add" aria-label="Добавить дело">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</nav>

<div class="sync" id="sync" hidden></div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast glass" id="toast" role="status">
  <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
  <div><div class="t1" id="toastT1"></div><div class="t2" id="toastT2"></div></div>
</div>

<script src="app.js"></script>
</body>
</html>
